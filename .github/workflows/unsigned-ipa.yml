name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unsigned-ipa.yml"
      - "iDex/**"
      - "iDex.xcodeproj/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode:"
          xcodebuild -version
          if ! xcodebuild -version | grep -q "Xcode 27.1"; then
            echo "::error::This runner does not have Xcode 27.1 selected. Update the runner/Xcode selection before building."
            exit 1
          fi

      - name: Build unsigned device archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iDex.xcodeproj \
            -scheme iDex \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iDex.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/iDex.xcarchive/Products/Applications/iDex.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/iDex.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/iDex-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/iDex-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/iDex-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDex-unsigned-IPA
          path: iDex-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
